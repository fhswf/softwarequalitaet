services:
  playwright-desktop:
    build: .
    image: playwright-desktop:latest
    container_name: playwright-desktop
    init: true
    stop_grace_period: 1s
    shm_size: '2gb'
    ports:
      - "6080:6080"
    volumes:
      - ../:/workspace
    environment:
      - DISPLAY=:99
      - RESOLUTION=1920x1080x24
    network_mode: bridge